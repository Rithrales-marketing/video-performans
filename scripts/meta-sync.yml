name: Veri senkronu (Meta + Salesforce)

on:
  schedule:
    - cron: '17 5,11,17 * * *'   # her gun 08:17 / 14:17 / 20:17 TR saati (UTC+3)
  workflow_dispatch:              # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  senkron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Meta'dan cek, Supabase'e yaz
        env:
          META_TOKEN:           ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT:      ${{ secrets.META_AD_ACCOUNT }}
          META_KAMPANYA_ONEK:   ${{ vars.META_KAMPANYA_ONEK || 'TEST-G' }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET:      ${{ vars.SUPABASE_BUCKET || 'panel' }}
        run: python scripts/meta_sync.py

      - name: Salesforce'tan randevu/islem cek
        continue-on-error: true          # CRM baglanmadiysa Meta verisi yine de yayinlansin
        env:
          SF_DOMAIN:            ${{ secrets.SF_DOMAIN }}
          SF_CLIENT_ID:         ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET:     ${{ secrets.SF_CLIENT_SECRET }}
          SF_OBJECT:            ${{ vars.SF_OBJECT || 'Account' }}
          SF_REKLAM_FIELD:      ${{ vars.SF_REKLAM_FIELD || 'CR_AdName__c' }}
          SF_ASAMA_FIELD:       ${{ vars.SF_ASAMA_FIELD || 'Stage__c' }}
          SF_KAMPANYA_KOSUL:    ${{ vars.SF_KAMPANYA_KOSUL }}
          SF_ASAMA_RANDEVU:     ${{ vars.SF_ASAMA_RANDEVU }}
          SF_ASAMA_MUAYENE:     ${{ vars.SF_ASAMA_MUAYENE }}
          SF_ASAMA_ISLEM:       ${{ vars.SF_ASAMA_ISLEM }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET:      ${{ vars.SUPABASE_BUCKET || 'panel' }}
        run: |
          if [ -z "$SF_DOMAIN" ]; then
            echo "SF_DOMAIN tanimli degil, Salesforce adimi atlandi."
          else
            python scripts/salesforce_sync.py
          fi

      - name: Repodaki yedegi guncelle
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json degismedi"
          else
            git config user.name  "meta-sync"
            git config user.email "actions@github.com"
            git add data.json
            git commit -m "Veri senkronu: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
